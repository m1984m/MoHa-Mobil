name = "moha-mobil-proxy"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Kdo sme klicati Worker. Vse ostalo dobi 403 — brez tega bi bil to odprt proxy
# na tvoj račun. Dev vnosa sta za `npm run dev` (Vite privzeto 9125).
[vars]
ALLOWED_ORIGINS = "https://m1984m.github.io,http://localhost:9125,http://127.0.0.1:9125"

# Glasno branje (POST /tts): Azure Speech, glas sl-SI-PetraNeural. Regija je
# tista, ki jo izberes ob ustvarjanju vira Speech na portal.azure.com (raven
# Free F0). West Europe 25.09.2026 ni sprejemal novih narocnikov (RequestDisallowedByAzure). Kljuc NI tu, je skrivnost:
#   npx wrangler secret put AZURE_SPEECH_KEY
# Brez kljuca /tts vrne 503 in aplikacija bere s sistemskim glasom telefona.
AZURE_SPEECH_REGION = "germanywestcentral"

# Posredniki za OBA, ker Cloudflare do vozniredi.marprom.si ne pride (tiho zavrženi
# paketi): od 16. do 22.09.2026 in znova od 05.10.2026 zvečer (Worker 502, neposredno
# 200 v 0,2 s). Vmes (22.09.–05.10.) posrednika ni bilo, ker je brezplačni Deno
# Deploy prekoračil kvoto in vračal 503. Seznam v vrstnem redu poskusov: Deno Deploy
# (Google, ../relay), nato Vercel (AWS Stockholm, ../relay-vercel; iz AWS Frankfurt
# Marprom ne odgovori, zato je Vercel zaklenjen na arn1). Skrivnost RELAY_KEY
# (npx wrangler secret put RELAY_KEY) mora biti enaka kot pri obeh posrednikih.
# Ko Marprom odblokira Cloudflare, to vrstico odstrani in Worker kliče neposredno.
# 12.10.2026: isti posredniki nosijo tudi ORS (pešpoti), ker ORS Cloudflara prav tako
# ne spusti — Worker najprej na kratko poskusi neposredno, glej worker/README.md (ORS
# prek posrednikov). Dokler je OBA_RELAY nastavljen, cron predpomnilnika ne greje
# (warm.js kliče Marprom neposredno).
OBA_RELAY = "https://moha-oba.m1984m.deno.net,https://moha-oba-vercel.vercel.app"

# Javni ključ VAPID. Ta SME biti v repozitoriju — brskalnik ga tako ali tako
# dobi ob naročanju (`applicationServerKey`), Worker pa ga vrne na
# GET /alarms/status, da ga odjemalcu ni treba imeti vgrajenega v paketu.
VAPID_PUBLIC = "BC-oaCOK8TZKJN5ckRuZkrhHmkJMb8J034-BuyrcJq7oKfi5QLQWhYpyDPupJqDHM1SBLfTrJI0N99vIbyYo0Y8"

# Kontakt, ki ga potisne storitve zahtevajo v žetonu VAPID (RFC 8292 `sub`).
# Ob težavi (npr. zloraba) te po tem naslovu obvestijo namesto da te blokirajo.
VAPID_SUBJECT = "mailto:matej.moharic@gmail.com"

# ORS_KEY in VAPID_PRIVATE NISTA tu — sta skrivnosti, nastavljeni z:
#   npx wrangler secret put ORS_KEY
#   npx wrangler secret put VAPID_PRIVATE
# (zasebni ključ je polje "privateKey" v worker/secrets/vapid.json — ta mapa je
# v .gitignore). Nikoli ju ne piši v to datoteko (je v gitu).

# Shramba naročnin in časov zvonjenja za alarme ob odhodu avtobusa.
# Imenski prostor ustvariš enkrat, nato spodaj prilepiš izpisani id:
#   npx wrangler kv namespace create ALARMS_KV
[[kv_namespaces]]
binding = "ALARMS_KV"
id = "e911212a8da84372b3feed1002153230"

# Cron vsako minuto: pošlje zapadla obvestila. Cloudflare zagona ne jamči na
# sekundo natančno (zamik nekaj deset sekund je običajen) — zato Worker pobere
# tudi zvonjenja, ki zapadejo v naslednjih 30 s.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Analitika: dogodki iz Workerja (klici OBA/ORS) in iz aplikacije (POST /ev).
# Na brezplacnem paketu je vkljucenih 100.000 zapisov in 10.000 poizvedb na dan
# (hramba tri mesece) -- pri nasi kolicini je to nedosegljivo dalec. Brez te
# vezave analitika tiho ne dela nicesar; nic drugega se ne spremeni.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "moha_mobil"

# Omejevalnik za /tts na naslov IP (brez pisanja v KV). Kvota Azure F0 je skupna
# vsem uporabnikom, zato en naslov ne sme poslati vec kot 20 novih besedil na
# minuto (dolgo branje gre v kosih po 700 znakov, vsak kos je en klic; en telefon
# prebere nekajkrat na minuto). namespace_id je poljubno stevilo, enolicno v
# racunu Cloudflare.
[[ratelimits]]
name = "TTS_LIMITER"
namespace_id = "7101"

  [ratelimits.simple]
  limit = 20
  period = 60

# Omejevalnik za /oba na naslov IP. Šteje SAMO klice mimo predpomnilnika (ni
# odgovora ali je ta potekel); zadetki so zastonj. Uporabnik jih ima malo, ker si
# vsi delijo isti predpomnilnik, zloraba (npr. zaporedni id-ji postajališč) pa
# same zgrešene — vsak tak klic gre na posrednika in troši njegovo kvoto.
# Ob zavrnitvi dobi uporabnik zadnji znani odgovor ali 429. Meja 300: Dom osveži do
# ~58 postajališč (8 bližnjih + do 50 priljubljenih) na 30 s, za mobilnim NAT-om je
# na istem naslovu lahko več ljudi — omejevalnik naj ustavi zlorabo, ne uporabnikov.
[[ratelimits]]
name = "OBA_LIMITER"
namespace_id = "7102"

  [ratelimits.simple]
  limit = 300
  period = 60

# Omejevalnik za /ors na naslov IP. Kvota openrouteservice (2.000 poti in 500
# matrik na dan) je skupna vsem uporabnikom. En načrt poti sta 2 matriki (začetek
# in cilj) in po ena pešpot za vsak peš odsek izbrane poti; aplikacija jih hrani.
# Ob zavrnitvi aplikacija nariše zračno črto, kot ob izpadu ORS.
[[ratelimits]]
name = "ORS_LIMITER"
namespace_id = "7103"

  [ratelimits.simple]
  limit = 30
  period = 60

# Omejevalnik za POST /ev (analitika) na naslov IP. Aplikacija pošilja svežnje do
# 20 dogodkov; zavora v izolatu (600 dogodkov na minuto) odjemalcev ne loči.
[[ratelimits]]
name = "EV_LIMITER"
namespace_id = "7104"

  [ratelimits.simple]
  limit = 30
  period = 60
