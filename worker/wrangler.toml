name = "moha-mobil-proxy"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Kdo sme klicati Worker. Vse ostalo dobi 403 â€” brez tega bi bil to odprt proxy
# na tvoj raÄŤun. Dev vnosa sta za `npm run dev` (Vite privzeto 9125).
[vars]
ALLOWED_ORIGINS = "https://m1984m.github.io,http://localhost:9125,http://127.0.0.1:9125"

# Posrednik za OBA. Cloudflare od 16.09.2026 ne pride do vozniredi.marprom.si
# (tiho zavrzeni paketi, izmerjeno 20.09.2026 — glej relay/README.md), zato gredo
# zive pozicije in prihodi skozi Deno Deploy na Googlovem oblaku. Naslov ni
# skrivnost; skupni kljuc RELAY_KEY je skrivnost (wrangler secret put RELAY_KEY).
# Ko Marprom odblokira Cloudflare, to vrstico odstrani in Worker spet klice
# Marproma neposredno.
OBA_RELAY = "https://moha-oba.m1984m.deno.net"

# Javni kljuÄŤ VAPID. Ta SME biti v repozitoriju â€” brskalnik ga tako ali tako
# dobi ob naroÄŤanju (`applicationServerKey`), Worker pa ga vrne na
# GET /alarms/status, da ga odjemalcu ni treba imeti vgrajenega v paketu.
VAPID_PUBLIC = "BC-oaCOK8TZKJN5ckRuZkrhHmkJMb8J034-BuyrcJq7oKfi5QLQWhYpyDPupJqDHM1SBLfTrJI0N99vIbyYo0Y8"

# Kontakt, ki ga potisne storitve zahtevajo v Ĺľetonu VAPID (RFC 8292 `sub`).
# Ob teĹľavi (npr. zloraba) te po tem naslovu obvestijo namesto da te blokirajo.
VAPID_SUBJECT = "mailto:matej.moharic@gmail.com"

# ORS_KEY in VAPID_PRIVATE NISTA tu â€” sta skrivnosti, nastavljeni z:
#   npx wrangler secret put ORS_KEY
#   npx wrangler secret put VAPID_PRIVATE
# (zasebni kljuÄŤ je polje "privateKey" v worker/secrets/vapid.json â€” ta mapa je
# v .gitignore). Nikoli ju ne piĹˇi v to datoteko (je v gitu).

# Shramba naroÄŤnin in ÄŤasov zvonjenja za alarme ob odhodu avtobusa.
# Imenski prostor ustvariĹˇ enkrat, nato spodaj prilepiĹˇ izpisani id:
#   npx wrangler kv namespace create ALARMS_KV
[[kv_namespaces]]
binding = "ALARMS_KV"
id = "e911212a8da84372b3feed1002153230"

# Cron vsako minuto: poĹˇlje zapadla obvestila. Cloudflare zagona ne jamÄŤi na
# sekundo natanÄŤno (zamik nekaj deset sekund je obiÄŤajen) â€” zato Worker pobere
# tudi zvonjenja, ki zapadejo v naslednjih 30 s.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Analitika: dogodki iz Workerja (klici OBA/ORS) in iz aplikacije (POST /ev).
# Na brezplacnem paketu je vkljucenih 100.000 zapisov in 10.000 poizvedb na dan
# (hramba tri mesece) -- pri nasi kolicini je to nedosegljivo dalec. Brez te
# vezave analitika tiho ne dela nicesar; nic drugega se ne spremeni.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "moha_mobil"
